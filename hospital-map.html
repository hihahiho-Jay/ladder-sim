const SHORT={'서울특별시':'서울','부산광역시':'부산','대구광역시':'대구','인천광역시':'인천','광주광역시':'광주','대전광역시':'대전','울산광역시':'울산','세종특별자치시':'세종','경기도':'경기','강원특별자치도':'강원','충청북도':'충북','충청남도':'충남','전북특별자치도':'전북','전라남도':'전남','경상북도':'경북','경상남도':'경남','제주특별자치도':'제주'};
// 라벨 위치 오프셋 [dx,dy] — 겹침 방지. 크게 뺀 곳은 리드선 자동
const LOFF={'경기도':[44,0],'인천광역시':[16,4],'충청북도':[-16,6],'경상남도':[0,-22],'전라남도':[8,-24]};
const norm=s=>(s||'').replace(/\s+/g,'');
const hsgg=h=> norm(h.sgg) || (h.sido==='세종특별자치시'?'세종시':'');
function muniKey(sido, muniName){
  if(sido==='인천광역시' && muniName==='남구') return '미추홀구';
  return muniName;
}
let curSido=null, curSgg=null, hlName=null;
const cnt=(f)=>HOSP.filter(f).length;
function badge(h){
  let b='<span class="badge '+(h.grade==='상급종합병원'?'b-top':'b-gen')+'">'+(h.grade==='상급종합병원'?'⭐ 상급종합':'종합병원')+'</span>';
  if(h.tag) b+=' <span class="badge b-cancer">🎗️ 암센터</span>';
  return b;
}
function cssId(s){ return (s||'').replace(/[^가-힣a-zA-Z0-9]/g,''); }
function drawNation(){
  const svg=document.getElementById('map');
  svg.setAttribute('viewBox','0 0 '+MAPD.W+' '+MAPD.H);
  document.getElementById('backbtn').style.display='none';
  document.querySelector('.mapcard').classList.remove('big');
  let s='';
  for(const nm in MAPD.PROV) s+='<path class="prov" d="'+MAPD.PROV[nm].d+'" onclick="pickSido(\''+nm+'\')"><title>'+nm+'</title></path>';
  for(const nm in MAPD.PROV){
    const c=MAPD.PROV[nm].c, o=LOFF[nm]||[0,0];
    const x=c[0]+o[0], y=c[1]+o[1];
    s+='<text class="plabel" x="'+x+'" y="'+(y-2)+'" text-anchor="middle">'+SHORT[nm]+'</text>';
    s+='<text class="pcount" x="'+x+'" y="'+(y+11)+'" text-anchor="middle">'+cnt(h=>h.sido===nm)+'</text>';
  }
  svg.innerHTML=s;
}
function drawSido(sido){
  const svg=document.getElementById('map');
  const bb=MAPD.PBOX[sido];
  const pad=Math.max((bb[2]-bb[0]),(bb[3]-bb[1]))*0.07;
  const vw=(bb[2]-bb[0])+pad*2, vh=(bb[3]-bb[1])+pad*2;
  svg.setAttribute('viewBox',(bb[0]-pad)+' '+(bb[1]-pad)+' '+vw+' '+vh);
  document.getElementById('backbtn').style.display='block';
  document.querySelector('.mapcard').classList.add('big');
  const fs2=Math.max(vw,vh)/46;
  let s='';
  (MAPD.MUNI[sido]||[]).forEach((m,i)=>{
    const key=muniKey(sido,m.n);
    const n=cnt(h=>h.sido===sido && hsgg(h)===norm(key));
    const cls='muni'+(n?' has':'')+((curSgg && norm(curSgg)===norm(key))?' sel':'');
    s+='<path id="mp-'+i+'" class="'+cls+'" d="'+m.d+'" onclick="pickSgg(\''+sido+'\',\''+key+'\')"><title>'+key+(n?' — '+n+'개':'')+'</title></path>';
  });
  (MAPD.MUNI[sido]||[]).forEach((m,i)=>{
    const key=muniKey(sido,m.n);
    const n=cnt(h=>h.sido===sido && hsgg(h)===norm(key));
    if(!n) return;
    const sel=(curSgg && norm(curSgg)===norm(key))?' sel':'';
    const short=key.replace(/^.+?시(?=.+구$)/,'');
    s+='<text id="ml-'+i+'" data-n="'+n+'" class="mlabel'+sel+'" x="'+m.c[0]+'" y="'+m.c[1]+'" text-anchor="middle" font-size="'+fs2+'">'+short+' '+n+'</text>';
  });
  svg.innerHTML=s;
  // 라벨 배치: 구역 크기 아닌 '라벨끼리 충돌' 기준 — 이름이 경계를 넘어도 서로 안 겹치면 표시
  try{
    const targets=[];
    (MAPD.MUNI[sido]||[]).forEach((m,i)=>{
      const t=document.getElementById('ml-'+i), p=document.getElementById('mp-'+i);
      if(t&&p) targets.push({t, sel:t.classList.contains('sel'), n:+t.dataset.n, bw:p.getBBox().width});
    });
    if(targets.length){
      const ws=targets.map(x=>x.bw).sort((a,b)=>a-b);
      const med=ws[Math.floor(ws.length/2)];
      const fs=Math.max(Math.min(med*0.32, Math.max(vw,vh)/32), Math.max(vw,vh)/72);
      targets.sort((a,b)=> (b.sel-a.sel) || (b.n-a.n));   // 선택 구 최우선 → 병원 많은 순
      const kept=[]; const pad=fs*0.25;
      const hit=(bb)=> kept.some(r=> !(bb.x+bb.width+pad<r.x || r.x+r.width+pad<bb.x || bb.y+bb.height+pad<r.y || r.y+r.height+pad<bb.y));
      targets.forEach(x=>{
        x.t.setAttribute('font-size',fs);
        let bb=x.t.getBBox();
        if(!x.sel && hit(bb)){ x.t.textContent=x.t.dataset.n; bb=x.t.getBBox(); }   // 겹치면 숫자만
        if(!x.sel && hit(bb)){ x.t.style.display='none'; return; }                  // 그래도 겹치면 숨김
        kept.push(bb);
      });
    }
  }catch(e){}
}
function pickSido(sido){ curSido=sido; curSgg=null; hlName=null; drawSido(sido); renderPanel(); }
function goNation(){ curSido=null; curSgg=null; hlName=null; drawNation(); renderPanel(); }
document.addEventListener('keydown', e=>{ if(e.key==='Escape' && curSido) goNation(); });
function pickSgg(sido,sgg){
  curSido=sido; curSgg=sgg; drawSido(sido); renderPanel();
  setTimeout(()=>{ const el=document.getElementById('sgg-'+cssId(sgg)); if(el) el.scrollIntoView({block:'start',behavior:'smooth'}); },60);
}
function renderPanel(){
  const p=document.getElementById('panel');
  if(!curSido){
    const sidos=[...new Set(HOSP.map(h=>h.sido))];
    p.innerHTML='<div class="ptitle">전국 현황</div><div class="pmeta">지도를 클릭하면 지역이 확대됩니다</div>'
      + sidos.map(s=>{
        const g=cnt(h=>h.sido===s&&h.grade==='종합병원'), t=cnt(h=>h.sido===s&&h.grade==='상급종합병원');
        return '<div class="sumrow" onclick="pickSido(\''+s+'\')"><b>'+s+'</b><span>종합 '+g+(t?' · <b style=color:#d92b2b>상급 '+t+'</b>':'')+'</span></div>';
      }).join('');
    return;
  }
  const list=HOSP.filter(h=>h.sido===curSido);
  const g=list.filter(h=>h.grade==='종합병원').length, t=list.filter(h=>h.grade==='상급종합병원').length;
  const sggs=[...new Set(list.map(h=>h.sgg||(h.sido==='세종특별자치시'?'세종시':'기타')))].sort((a,b)=>a.localeCompare(b,'ko'));
  let s='<div class="phead"><div class="ptitle">'+curSido+' <span style="font-weight:600;color:#5a6685;font-size:13px">('+list.length+'개)</span></div>'
    +'<div class="pmeta" style="margin-bottom:0">종합병원 '+g+'개'+(t?' · <b style="color:#d92b2b">상급종합 '+t+'개</b>':'')
    +' <span style="float:right;cursor:pointer;color:#3b6cff;font-weight:700" onclick="goNation()">← 전국</span></div></div>';
  sggs.forEach(sg=>{
    const hs=list.filter(h=>(h.sgg||(h.sido==='세종특별자치시'?'세종시':'기타'))===sg);
    const selG=(curSgg && norm(curSgg)===norm(sg));
    const sel=selG?' sel':'';
    s+='<div class="sgghead'+sel+'" id="sgg-'+cssId(sg)+'" onclick="pickSgg(\''+curSido+'\',\''+sg+'\')">'+sg+' ('+hs.length+')</div>';
    hs.sort((a,b)=>(a.grade>b.grade?-1:1)).forEach(h=>{
      const hl=(h.name===hlName)?' hl':(selG?' ing':'');
      s+='<div class="hosp'+hl+'" id="h-'+cssId(h.name)+'"><div style="flex:none;padding-top:1px">'+badge(h)+'</div>'
        +'<div style="min-width:0"><div class="nm">'+h.name+'</div><div class="ad">'+h.addr+'</div></div></div>';
    });
  });
  p.innerHTML=s;
}
const q=document.getElementById('q'), sug=document.getElementById('sugg');
q.addEventListener('input', onSearch);
q.addEventListener('focus', onSearch);
document.addEventListener('click', e=>{ if(!e.target.closest('.searchbox')) sug.style.display='none'; });
function onSearch(){
  const v=q.value.trim();
  if(!v){ sug.style.display='none'; return; }
  const hits=HOSP.filter(h=> h.name.includes(v)||h.addr.includes(v)||(h.sgg||'').includes(v)||h.sido.includes(v)).slice(0,12);
  if(!hits.length){ sug.innerHTML='<div class="sg" style="cursor:default;color:#8a93ad">검색 결과 없음</div>'; sug.style.display='block'; return; }
  sug.innerHTML=hits.map(h=>'<div class="sg" onclick="goHosp('+HOSP.indexOf(h)+')">'
    +badge(h)
    +'<div style="min-width:0"><div class="nm">'+h.name+' <span style="font-weight:600;color:#5a6685;font-size:11.5px">'+h.sido+' '+(h.sgg||'')+'</span></div>'
    +'<div class="ad">'+h.addr+'</div></div></div>').join('');
  sug.style.display='block';
}
function goHosp(idx){
  const h=HOSP[idx];
  sug.style.display='none'; q.value=h.name;
  curSido=h.sido; curSgg=h.sgg||null; hlName=h.name;
  drawSido(h.sido); renderPanel();
  setTimeout(()=>{ const el=document.getElementById('h-'+cssId(h.name)); if(el) el.scrollIntoView({block:'center',behavior:'smooth'}); },80);
}
drawNation(); renderPanel();
